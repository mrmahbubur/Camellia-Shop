    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mrs_theme') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

          loaded = true;
          var path = window.location.pathname;
          var docsBase = './docs/';
          if (window.location.hostname.endsWith('github.io') && /^\/[^/]+$/.test(path)) {
            docsBase = path + '/docs/';

          var link = document.createElement('link');
          link.rel = 'stylesheet';

          script.type = 'module';
          script.src = docsBase + 'assets/camellia-app.js';
          document.body.appendChild(script);

        window.addEventListener(

              loadBuiltBundle();
            }
          },
          true
        );
        setTimeout(loadBuiltBundle, 350);
      })();
    </script>
